[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Single Page Application Client Routing Fix for Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "SAMEORIGIN"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"

# Service Worker Cache Policy
[[headers]]
  for = "/sw.js"
    [headers.values]
      Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
    [headers.values]
      Cache-Control = "no-cache"
